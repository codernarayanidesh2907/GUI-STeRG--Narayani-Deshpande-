<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Tech Dashboard</title>
    <link rel="stylesheet" href="team.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    </head>
<body>

<div class="dashboard-container">
    <div class="header">
        <div class="logo-mit">
           <img src="mitwpu1.png" alt="MIT-WPU Logo" class="mit-logo">
        </div>
        
        <div class="center-title">CAMERA</div>
        
        <div class="timer">T-88:88</div>
        
        <div class="sterg-box">
            <img src="sterg1.png" alt="STeRG Logo" class="sterg-logo">
            
        </div>
    </div>

    <div class="camera-grid">
        <div class="cam-feed" id="cam1">
            <video id="video1" class="cam-video" autoplay playsinline></video>
        <button onclick="startCamera('video1')" class="cam-btn">Enable CAM</button>
            <div class="cam-label">CAM</div>
        </div>
        
    </div>

    <div class="footer">
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        <div class="percentage">100%</div>
    </div>
</div>

</body>
</html>
